name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # macos-26 ships Xcode 26.x only; Xcode 27 lives on the xcode-27 preview image until it lands there.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version

      - name: Lint
        run: swift format lint --recursive --strict Packages Keypad

      - name: Test
        run: swift test --package-path Packages/KeypadKit

      - name: Build
        run: >-
          xcodebuild -project Keypad.xcodeproj -scheme Keypad -configuration Debug
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
